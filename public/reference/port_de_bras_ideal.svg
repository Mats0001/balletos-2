<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <rect width="80" height="120" fill="#0a0a12" rx="8"/>
  <!-- Torso -->
  <line x1="40" y1="28" x2="40" y2="60" stroke="#a881bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="40" cy="20" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Shoulder line (horizontal = correct) -->
  <line x1="18" y1="40" x2="62" y2="40" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm - straight Port de Bras -->
  <line x1="18" y1="40" x2="4" y2="60" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="60" x2="2" y2="78" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm - raised 2nd position -->
  <line x1="62" y1="40" x2="76" y2="28" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="28" x2="78" y2="18" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Elbow dots -->
  <circle cx="4" cy="60" r="2.5" fill="#c084fc"/>
  <circle cx="76" cy="28" r="2.5" fill="#c084fc"/>
  <!-- Horizontal level indicator -->
  <line x1="5" y1="40" x2="75" y2="40" stroke="#30d158" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.5"/>
  <!-- Legs -->
  <line x1="28" y1="60" x2="25" y2="95" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="60" x2="55" y2="95" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Hip line -->
  <line x1="28" y1="60" x2="52" y2="60" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark -->
  <circle cx="65" cy="15" r="9" fill="#30d158" opacity="0.9"/>
  <polyline points="61,15 64,18 70,11" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="8" font-family="sans-serif" font-size="5" fill="#30d158" text-anchor="middle" font-weight="bold">IDEAL</text>
</svg>
