<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <rect width="80" height="120" fill="#0a0a12" rx="8"/>
  <!-- Torso -->
  <line x1="40" y1="28" x2="40" y2="62" stroke="#a881bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head with slight épaulement tilt -->
  <circle cx="41" cy="20" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Shoulder line - slightly diagonal (épaulement) -->
  <line x1="20" y1="42" x2="60" y2="38" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal reference -->
  <line x1="5" y1="40" x2="75" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="2,3"/>
  <!-- Left arm (en bas) -->
  <line x1="20" y1="42" x2="8" y2="55" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="55" x2="6" y2="68" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm (en haut) -->
  <line x1="60" y1="38" x2="72" y2="24" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="24" x2="74" y2="14" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hip line -->
  <line x1="28" y1="62" x2="52" y2="62" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="28" y1="62" x2="24" y2="98" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="62" x2="56" y2="98" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Elbow dots -->
  <circle cx="8" cy="55" r="2.5" fill="#c084fc"/>
  <circle cx="72" cy="24" r="2.5" fill="#c084fc"/>
  <!-- Star for "best" -->
  <circle cx="65" cy="15" r="9" fill="#f5a623" opacity="0.9"/>
  <text x="65" y="19" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">★</text>
  <text x="40" y="8" font-family="sans-serif" font-size="5" fill="#f5a623" text-anchor="middle" font-weight="bold">STÄRKE</text>
</svg>
