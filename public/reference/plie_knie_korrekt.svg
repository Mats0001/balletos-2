<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <rect width="80" height="120" fill="#0a0a12" rx="8"/>
  <!-- Torso -->
  <line x1="40" y1="28" x2="40" y2="65" stroke="#a881bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="40" cy="20" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Hips -->
  <line x1="28" y1="65" x2="52" y2="65" stroke="#a881bd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg - knees OUT (correct) -->
  <line x1="28" y1="65" x2="16" y2="90" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="90" x2="20" y2="112" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg - knees OUT (correct) -->
  <line x1="52" y1="65" x2="64" y2="90" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="60" y2="112" stroke="#30d158" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Knee dots -->
  <circle cx="16" cy="90" r="3" fill="#30d158"/>
  <circle cx="64" cy="90" r="3" fill="#30d158"/>
  <!-- Foot dots -->
  <circle cx="20" cy="112" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="60" cy="112" r="2.5" fill="#ffffff" opacity="0.7"/>
  <!-- Shoulders -->
  <line x1="22" y1="40" x2="58" y2="40" stroke="#a881bd" stroke-width="2" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="22" y1="40" x2="10" y2="58" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="70" y2="58" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark -->
  <circle cx="65" cy="15" r="9" fill="#30d158" opacity="0.9"/>
  <polyline points="61,15 64,18 70,11" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label -->
  <text x="40" y="8" font-family="sans-serif" font-size="5" fill="#30d158" text-anchor="middle" font-weight="bold">KORREKT</text>
</svg>
